<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b1d7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RANDOM MIND — Think. Guess. Learn!</title>

  <!-- Google Fonts: Fredoka for playful rounded game headers & Nunito for crisp readable UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
       RANDOM MIND — DESIGN TOKENS & STRICT UI RULES
       - Purple & blue fantasy starry background
       - Soft clouds decorating the bottom
       - Rounded typography & compact mobile-first layout
       - STRICT RULE: NO button click scale/bouncing/glowing/pressing animations
       ========================================================================== */
    :root {
      --bg-deep: #261159;
      --bg-mid: #3f218c;
      --bg-blue: #27469e;
      --lavender-card: #f5f2ff;
      --lavender-border: #d9ceff;
      --purple-ink: #351a75;
      --yellow-logo: #ffd93b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at top, #1b0d42 0%, #100729 100%);
      color: #2c1663;
      overflow: hidden;
    }

    .font-logo {
      font-family: 'Fredoka', sans-serif;
    }

    /* Mobile App Shell: Full screen on mobile, centered phone viewport on desktop */
    .app-shell {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 900px;
      margin: 0 auto;
      background: linear-gradient(180deg, #2d166b 0%, #442499 42%, #2f4eb0 78%, #5b7be0 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    @media (min-width: 480px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .app-shell {
        height: calc(100dvh - 24px);
        border-radius: 32px;
        border: 3px solid rgba(255, 255, 255, 0.18);
      }
    }

    /* Starry Sky Layer */
    .star-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star-dot {
      position: absolute;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
    }

    .star-four {
      position: absolute;
      pointer-events: none;
    }

    /* Bottom Clouds Layer */
    .clouds-footer {
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      width: 100%;
      pointer-events: none;
      z-index: 1;
      line-height: 0;
    }

    /* Main Scrollable Screen Container */
    .screen-body {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 18px 24px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
    }

    .screen-body::-webkit-scrollbar {
      display: none;
    }

    /* RANDOM MIND Logo Styling (White RANDOM, Yellow MIND, heavy purple outline & drop shadow) */
    .rm-logo-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.94;
      text-align: center;
    }

    .rm-word-random {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
      -webkit-text-stroke: 5px #38187a;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 #260f57, 0 6px 12px rgba(20, 6, 56, 0.45);
    }

    .rm-word-mind {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #ffd93b;
      letter-spacing: 0.04em;
      -webkit-text-stroke: 5px #38187a;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 #260f57, 0 6px 12px rgba(20, 6, 56, 0.45);
    }

    /* Clean, tactile game buttons — NO bouncing, scaling, glowing, or pressing animations */
    .rm-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 16px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 0 rgba(33, 14, 79, 0.38);
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .rm-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-green {
      background: linear-gradient(180deg, #43d97b 0%, #24b35b 100%);
      color: #ffffff;
      border-color: #8cf2b0;
      box-shadow: 0 4px 0 #167a3c;
    }
    .btn-green:hover:not(:disabled) {
      background: linear-gradient(180deg, #3ac96f 0%, #1fa151 100%);
    }

    .btn-blue {
      background: linear-gradient(180deg, #4da6ff 0%, #2678e8 100%);
      color: #ffffff;
      border-color: #99ccff;
      box-shadow: 0 4px 0 #174fa3;
    }
    .btn-blue:hover:not(:disabled) {
      background: linear-gradient(180deg, #4298f0 0%, #1f6bd4 100%);
    }

    .btn-purple {
      background: linear-gradient(180deg, #9d6bff 0%, #713ce0 100%);
      color: #ffffff;
      border-color: #cbb0ff;
      box-shadow: 0 4px 0 #48209e;
    }
    .btn-purple:hover:not(:disabled) {
      background: linear-gradient(180deg, #8f5cf2 0%, #6432cf 100%);
    }

    .btn-orange {
      background: linear-gradient(180deg, #ff9f43 0%, #eb7317 100%);
      color: #ffffff;
      border-color: #ffd0a1;
      box-shadow: 0 4px 0 #a64a05;
    }
    .btn-orange:hover:not(:disabled) {
      background: linear-gradient(180deg, #f29238 0%, #d9670f 100%);
    }

    .btn-pink {
      background: linear-gradient(180deg, #ff6fa5 0%, #e03e7b 100%);
      color: #ffffff;
      border-color: #ffb8d3;
      box-shadow: 0 4px 0 #991f4e;
    }
    .btn-pink:hover:not(:disabled) {
      background: linear-gradient(180deg, #f06297 0%, #cc336d 100%);
    }

    .btn-lavender {
      background: #f4f0ff;
      color: #361b78;
      border-color: #d6c8ff;
      box-shadow: 0 3px 0 #b8a3f5;
    }
    .btn-lavender:hover:not(:disabled) {
      background: #eae3ff;
    }

    /* Pastel Lavender Card */
    .lavender-card {
      background: rgba(248, 245, 255, 0.96);
      border: 2px solid #dfd4ff;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(24, 9, 64, 0.25);
    }

    /* Answer Option Pill */
    .option-card {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 2px solid #ded4ff;
      border-radius: 15px;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #cfc0fa;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .option-card:hover:not(:disabled) {
      background: #f5f1ff;
      border-color: #a98eff;
    }

    .option-card.selected {
      background: #ebe3ff;
      border-color: #6f3ee0;
      box-shadow: 0 3px 0 #5528bd;
    }

    .option-card.correct {
      background: #dcfce7;
      border-color: #22c55e;
      box-shadow: 0 3px 0 #15803d;
    }

    .option-card.incorrect {
      background: #fee2e2;
      border-color: #ef4444;
      box-shadow: 0 3px 0 #b91c1c;
    }

    .option-card:disabled {
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Starry Sky Decorative Backdrop -->
    <div id="star-layer" class="star-layer" aria-hidden="true"></div>

    <!-- Active Screen View Mount -->
    <div id="screen-root" class="relative z-10 flex-1 flex flex-col overflow-hidden"></div>

    <!-- Modal / Popup Overlay Mount (Hint Popup, Legal Info, Confirmations, Toast) -->

  </div>

  <script>
    /* ==========================================================================
       1. PWA MANIFEST & SERVICE WORKER REGISTRATION
       ========================================================================== */
    const PWA_STATUS = {
      manifestReady: false,
      swState: 'Initializing...'
    };

    (function initPWA() {
      try {
        // Generate crisp SVG app icon data URL for manifest
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#3b1d7a"/><circle cx="96" cy="86" r="52" fill="#ff9ec4" stroke="#5c1d45" stroke-width="6"/><circle cx="76" cy="82" r="14" fill="#ffffff" stroke="#351a75" stroke-width="5"/><circle cx="116" cy="82" r="14" fill="#ffffff" stroke="#351a75" stroke-width="5"/><line x1="90" y1="82" x2="102" y2="82" stroke="#351a75" stroke-width="5"/><rect x="64" y="114" width="64" height="36" rx="6" fill="#7c3aed" stroke="#351a75" stroke-width="5"/></svg>`;
        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

        const manifest = {
          name: 'RANDOM MIND — Think. Guess. Learn!',
          short_name: 'RANDOM MIND',
          description: 'Colorful, educational general knowledge quiz game.',
          start_url: './',
          display: 'standalone',
          background_color: '#2d166b',
          theme_color: '#3b1d7a',
          icons: [
            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml' },
            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
          ]
        };

        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(manifestLink);
        PWA_STATUS.manifestReady = true;

        // Register Service Worker if supported and not blocked by sandboxed blob origin
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          const swCode = `
            const CACHE_NAME = 'random-mind-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              event.respondWith(
                caches.match(event.request).then((cached) => cached || fetch(event.request).catch(() => cached))
              );
            });
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          navigator.serviceWorker.register(swUrl)
            .then(() => { PWA_STATUS.swState = 'Active (Offline Ready)'; })
            .catch(() => { PWA_STATUS.swState = 'Local Cache Active (Sandbox Preview)'; });
        } else {
          PWA_STATUS.swState = 'Local Storage Offline Ready';
        }
      } catch (e) {
        PWA_STATUS.swState = 'Local Storage Offline Ready';
      }
    })();

    // Build a randomized 10-question round matching selected difficulty with maximum category diversity
    function generateRoundQuestions(difficulty) {
      const pool = QUESTION_BANK.filter(q => q.difficulty === difficulty);
      // Shuffle pool using Fisher-Yates
      const shuffled = [...pool];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      // Prioritize distinct categories first, then fill up to 10 without duplicates
      const selected = [];
      const usedCategories = new Set();
      const usedQuestions = new Set();

      for (const q of shuffled) {
        if (selected.length >= QUESTIONS_PER_ROUND) break;
        if (!usedCategories.has(q.category)) {
          selected.push(q);
          usedCategories.add(q.category);
          usedQuestions.add(q.question);
        }
      }

      for (const q of shuffled) {
        if (selected.length >= QUESTIONS_PER_ROUND) break;
        if (!usedQuestions.has(q.question)) {
          selected.push(q);
          usedQuestions.add(q.question);
        }
      }

      // Final shuffle of selected 10 questions so categories appear in unpredictable order
      for (let i = selected.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [selected[i], selected[j]] = [selected[j], selected[i]];
      }

      return selected;
    }

    function startQuizRound(difficulty, isOffline = false) {
      const questions = generateRoundQuestions(difficulty);
      quizSession = {
        active: true,
        isOffline: Boolean(isOffline),
        difficulty,
        questions,
        currentIndex: 0,
        selectedOption: null,
        submitted: false,
        isProcessing: false,
        hintUsedOnCurrent: false,
        score: 0,
        synxEarned: 0
      };
      navigateTo('quiz');
    }

    function selectAnswerOption(idx) {
      if (quizSession.submitted || quizSession.isProcessing) return;
      quizSession.selectedOption = idx;
      renderScreen();
    }

    function submitCurrentAnswer() {
      if (quizSession.selectedOption === null || quizSession.submitted || quizSession.isProcessing) {
        return;
      }
      quizSession.isProcessing = true;
      quizSession.submitted = true;

      const currentQ = quizSession.questions[quizSession.currentIndex];
      const isCorrect = quizSession.selectedOption === currentQ.correctIndex;

      if (isCorrect) {
        quizSession.score += 1;
        if (!quizSession.isOffline) {
          const reward = DIFFICULTY_CONFIG[quizSession.difficulty].synxPerCorrect;
          quizSession.synxEarned += reward;
          playerState.synx += reward;
          savePlayerState();
        }
      }

      quizSession.isProcessing = false;
      renderScreen();
    }

    function useHintOnQuestion() {
      if (quizSession.isOffline || quizSession.submitted || quizSession.hintUsedOnCurrent) return;

      if (playerState.synx < HINT_COST) {
        showInfoModal(
          'Not Enough SYNX',
          'HINT · 15 SYNX',
          `<p>You currently have <strong>${formatSynx(playerState.synx)}</strong>, and a hint costs <strong>${HINT_COST} SYNX</strong>.</p><p class="mt-2">Answer questions correctly in Ranked Play or claim your Daily Gift on the Home Screen to earn more SYNX!</p>`
        );
        return;
      }

      playerState.synx -= HINT_COST;
      quizSession.hintUsedOnCurrent = true;
      savePlayerState();
      renderScreen();

      const currentQ = quizSession.questions[quizSession.currentIndex];
      showHintModal(currentQ.hint);
    }

    function advanceQuizStep() {
      if (!quizSession.submitted) return;

      if (quizSession.currentIndex + 1 < quizSession.questions.length) {
        quizSession.currentIndex += 1;
        quizSession.selectedOption = null;
        quizSession.submitted = false;
        quizSession.hintUsedOnCurrent = false;
        renderScreen();
      } else {
        completeQuizRound();
      }
    }

    function completeQuizRound() {
      const totalQ = quizSession.questions.length;
      const correctCount = quizSession.score;

      // Save ranked progression & stats ONLY when NOT in Offline Practice Mode
      if (!quizSession.isOffline) {
        const xpEarned = correctCount * DIFFICULTY_CONFIG[quizSession.difficulty].xpPerCorrect;
        playerState.xp += xpEarned;
        playerState.roundsCompleted += 1;
        playerState.totalCorrect += correctCount;
        playerState.totalAnswered += totalQ;

        playerState.history.unshift({
          date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
          difficulty: quizSession.difficulty,
          score: `${correctCount}/${totalQ}`,
          synxEarned: quizSession.synxEarned
        });
        if (playerState.history.length > 15) {
          playerState.history = playerState.history.slice(0, 15);
        }
        savePlayerState();
      }

      quizSession.active = false;
      navigateTo('results');
    }

          break;

        case 'difficulty':

        case 'offline':

        case 'quiz':

        case 'results':

        case 'level':

          break;
        case 'settings':

    }

                  ${quizSession.submitted || quizSession.hintUsedOnCurrent ? 'disabled' : ''}
                  class="rm-btn btn-orange px-3 py-2.5 text-xs shrink-0">
                  ${ICONS.bulb}
                  <span>${quizSession.hintUsedOnCurrent ? 'Hint Used' : 'Hint · 15 SYNX'}</span>
                </button>
              ` : `
                <span class="text-[11px] font-bold text-[#6e52b8] px-1">
                  Hints disabled offline
                </span>
              `}

              ${!quizSession.submitted ? `
                <button type="button"
                  onclick="submitCurrentAnswer()"
                  ${quizSession.selectedOption === null ? 'disabled' : ''}
                  class="rm-btn btn-green flex-1 py-2.5 text-xs">
                  <span>Submit Answer</span>
                </button>
              ` : `
                <button type="button"
                  onclick="advanceQuizStep()"
                  class="rm-btn btn-blue flex-1 py-2.5 text-xs">
                  <span>${isLastQuestion ? 'See Results' : 'Next Question'}</span>
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function confirmQuitQuiz() {
      showInfoModal(
        'Leave Current Round?',
        'EXIT ROUND',
        `<p>If you leave now, this 10-question round will not be completed.</p>`,
        () => navigateTo('home'),
        'Leave Round'
      );
    }

    /* --- SCREEN 9: ROUND COMPLETION SCREEN --- */
    function viewResultsScreen() {
      const totalQ = quizSession.questions.length || 10;
      const correct = quizSession.score;
      const incorrect = totalQ - correct;
      const accuracy = Math.round((correct / totalQ) * 100);
      const isOffline = quizSession.isOffline;

      return `
        <div class="screen-body justify-between items-center text-center pt-5 pb-16">
          <div>
            <h1 class="font-logo text-3xl text-[#ffd93b] drop-shadow" style="-webkit-text-stroke: 3px #351a75; paint-order: stroke fill;">
              ROUND COMPLETE!
            </h1>
            <p class="text-xs font-extrabold text-purple-100 mt-0.5">
              ${isOffline ? 'Offline Practice Summary' : `${quizSession.difficulty} Difficulty Summary`}
            </p>
          </div>

          <div class="flex items-center justify-center gap-2 my-1">
            ${getGoldTrophySVG()}
            ${getMascotSVG(94, true)}
          </div>

          <!-- Results Statistics Card -->
          <div class="lavender-card w-full p-4 text-left my-auto">
            <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-[#e2d8ff]">
              <span class="text-xs font-extrabold text-[#5a3fa3]">Your Score</span>
              <span class="font-logo text-2xl text-[#351a75]">${correct}/${totalQ}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">Accuracy</div>
                <div class="text-base font-extrabold text-[#351a75]">${accuracy}%</div>
              </div>
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">SYNX Earned</div>
                <div class="text-base font-extrabold ${isOffline ? 'text-slate-500' : 'text-amber-600'}">
                  ${isOffline ? '0 (Offline)' : `+${quizSession.synxEarned}`}
                </div>
              </div>
              <div class="bg-emerald-50 rounded-xl p-2.5 border border-emerald-200">
                <div class="text-[11px] font-bold text-emerald-700">Correct</div>
                <div class="text-base font-extrabold text-emerald-800">${correct}</div>
              </div>
              <div class="bg-rose-50 rounded-xl p-2.5 border border-rose-200">
                <div class="text-[11px] font-bold text-rose-700">Incorrect</div>
                <div class="text-base font-extrabold text-rose-800">${incorrect}</div>
              </div>
            </div>
          </div>

          <!-- Action Buttons: END GAME & PLAY MORE (Normal / Hard / Easy) -->
          <div class="w-full space-y-2 mt-3 z-10">
            <div class="text-xs font-extrabold text-white tracking-wide uppercase">PLAY MORE</div>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="startQuizRound('Easy', ${isOffline})" class="rm-btn btn-green py-2.5 text-xs">
                Easy
              </button>
              <button type="button" onclick="startQuizRound('Normal', ${isOffline})" class="rm-btn btn-blue py-2.5 text-xs">
                Normal
              </button>
              <button type="button" onclick="startQuizRound('Hard', ${isOffline})" class="rm-btn btn-pink py-2.5 text-xs">
                Hard
              </button>
            </div>
            <button type="button" onclick="navigateTo('home')" class="rm-btn btn-lavender w-full py-2.5 text-xs">
              END GAME
            </button>
          </div>
        </div>
        ${getCloudsSVG()}
      `;
    }

    /* --- SCREEN 11: PLAYER LEVEL & PROGRESSION SCREEN --- */
    function viewLevelScreen() {
      const { level, currentLevelXp, nextLevelXp } = getLevelInfo(playerState.xp);
      const overallAcc = playerState.totalAnswered > 0
        ? Math.round((playerState.totalCorrect / playerState.totalAnswered) * 100)
        : 0;

      return `
        <div class="screen-body pt-4 pb-16">
          <div class="flex items-center justify-between mb-3">
            <button type="button" onclick="navigateTo('home')" class="rm-btn btn-lavender px-3 py-1.5 text-xs">
              ${ICONS.back}
              <span>Home</span>
            </button>
            <span class="px-3 py-1 rounded-full bg-[#240f59] border border-[#ffd93b] text-[#ffd93b] font-extrabold text-xs">
              ${formatSynx(playerState.synx)}
            </span>
          </div>

          <h1 class="font-logo text-2xl text-white text-center mb-3 drop-shadow">Player Progression</h1>

          <!-- XP & Scholar Level Card -->
          <div class="lavender-card p-4 mb-3">
            <div class="flex items-center justify-between mb-2">
              <div>
                <div class="text-[11px] font-extrabold text-[#6b4eb5] uppercase">Scholar Rank</div>
                <div class="font-logo text-2xl text-[#351a75]">Level ${level}</div>
              </div>
              <div class="text-right">
                <div class="text-[11px] font-bold text-[#6b4eb5]">Total XP</div>
                <div class="text-sm font-extrabold text-[#351a75]">${playerState.xp} XP</div>
              </div>
            </div>

            <div class="w-full h-3 rounded-full bg-[#e3d9ff] overflow-hidden mb-1">
              <div class="h-full bg-gradient-to-r from-[#6f3ee0] to-[#3b82f6]" style="width: ${(currentLevelXp / nextLevelXp) * 100}%;"></div>
            </div>
            <div class="flex justify-between text-[11px] font-bold text-[#6347ab]">
              <span>Progress to Level ${level + 1}</span>
              <span>${currentLevelXp} / ${nextLevelXp} XP</span>
            </div>
          </div>

          <!-- Lifetime Statistics Grid -->
          <div class="lavender-card p-4 mb-3">
            <h2 class="font-logo text-base text-[#351a75] mb-2.5">Lifetime Statistics</h2>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">Rounds Completed</div>
                <div class="text-base font-extrabold text-[#351a75]">${playerState.roundsCompleted}</div>
              </div>
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">Overall Accuracy</div>
                <div class="text-base font-extrabold text-[#351a75]">${overallAcc}%</div>
              </div>
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">Correct Answers</div>
                <div class="text-base font-extrabold text-emerald-700">${playerState.totalCorrect}</div>
              </div>
              <div class="bg-white rounded-xl p-2.5 border border-[#e5dcff]">
                <div class="text-[11px] font-bold text-[#6e52b8]">Questions Answered</div>
                <div class="text-base font-extrabold text-[#351a75]">${playerState.totalAnswered}</div>
              </div>
            </div>
          </div>

          <!-- Recent Ranked Rounds -->
          <div class="lavender-card p-4">
            <h2 class="font-logo text-base text-[#351a75] mb-2">Recent Ranked Rounds</h2>
            ${playerState.history.length === 0 ? `
              <p class="text-xs font-bold text-[#6e52b8]">No ranked rounds completed yet. Tap PLAY on Home to begin!</p>
            ` : `
              <div class="space-y-1.5">
                ${playerState.history.slice(0, 5).map(item => `
                  <div class="bg-white rounded-xl px-3 py-2 border border-[#e5dcff] flex items-center justify-between text-xs">
                    <div>
                      <span class="font-extrabold text-[#351a75]">${escapeHtml(item.difficulty)}</span>
                      <span class="text-[#785cc2] ml-1.5">${escapeHtml(item.date)}</span>
                    </div>
                    <div class="flex items-center gap-2.5">
                      <span class="font-extrabold text-[#351a75]">${escapeHtml(item.score)}</span>
                      <span class="font-extrabold text-amber-600">+${item.synxEarned} SYNX</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
        ${getCloudsSVG()}
      `;
    }

    /* --- SCREEN 12: SYNX SHOP SCREEN --- */
    function viewShopScreen() {
      return `
        <div class="screen-body pt-4 pb-16">
          <div class="flex items-center justify-between mb-3">
            <button type="button" onclick="navigateTo('home')" class="rm-btn btn-lavender px-3 py-1.5 text-xs">
              ${ICONS.back}
              <span>Home</span>
            </button>
            <span class="px-3 py-1 rounded-full bg-[#240f59] border-2 border-[#ffd93b] text-[#ffd93b] font-extrabold text-xs">
              ${formatSynx(playerState.synx)}
            </span>
          </div>

          <h1 class="font-logo text-2xl text-white text-center mb-1 drop-shadow">SYNX Shop</h1>
          <p class="text-xs font-bold text-purple-100 text-center mb-3">
            Earn SYNX by answering questions correctly—no real-money purchases.
          </p>

          <!-- In-Game Hint Info Card -->
          <div class="lavender-card p-3.5 mb-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 border border-amber-300 flex items-center justify-center shrink-0">
              ${ICONS.bulb}
            </div>
            <div>
              <div class="font-logo text-sm text-[#351a75]">In-Quiz Clue · 15 SYNX</div>
              <div class="text-xs font-bold text-[#5e43a6]">
                Available during any Ranked question when you need a helpful nudge without spoiling the answer.
              </div>
            </div>
          </div>

          <!-- Mascot Cosmetic Rewards -->
          <div class="lavender-card p-4">
            <div class="flex items-center justify-between mb-2.5">
              <h2 class="font-logo text-base text-[#351a75]">Brain Mascot Styles</h2>
              <div>${getMascotSVG(52, false)}</div>
            </div>

            <div class="space-y-2.5">
              ${SHOP_COSMETICS.map(item => {
                const unlocked = playerState.unlockedCosmetics.includes(item.id);
                const equipped = playerState.equippedCosmetic === item.id;
                return `
                  <div class="bg-white rounded-2xl p-3 border border-[#e3d9ff] flex items-center justify-between gap-2.5">
                    <div>
                      <div class="text-xs font-extrabold text-[#351a75]">${escapeHtml(item.name)}</div>
                      <div class="text-[11px] font-semibold text-[#6448ad] mt-0.5">${escapeHtml(item.desc)}</div>
                    </div>
                    ${equipped ? `
                      <span class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-extrabold shrink-0">
                        Equipped
                      </span>
                    ` : unlocked ? `
                      <button type="button" onclick="equipCosmetic('${item.id}')" class="rm-btn btn-blue px-3 py-1.5 text-xs shrink-0">
                        Equip
                      </button>
                    ` : `
                      <button type="button" onclick="buyCosmetic('${item.id}', ${item.cost})" class="rm-btn btn-orange px-3 py-1.5 text-xs shrink-0">
                        ${item.cost} SYNX
                      </button>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
        ${getCloudsSVG()}
      `;
    }

    function buyCosmetic(id, cost) {
      if (playerState.synx < cost) {
        showInfoModal(
          'Not Enough SYNX',
          `REQUIRES ${cost} SYNX`,
          `<p>You have <strong>${formatSynx(playerState.synx)}</strong>. Complete Ranked rounds to earn more SYNX!</p>`
        );
        return;
      }
      playerState.synx -= cost;
      playerState.unlockedCosmetics.push(id);
      playerState.equippedCosmetic = id;
      savePlayerState();
      renderScreen();
    }

    function equipCosmetic(id) {
      playerState.equippedCosmetic = id;
      savePlayerState();
      renderScreen();
    }

    /* --- SCREEN 13: SETTINGS SCREEN --- */
    function viewSettingsScreen() {
      return `
        <div class="screen-body pt-4 pb-16">
          <div class="flex items-center justify-between mb-3">
            <button type="button" onclick="navigateTo('home')" class="rm-btn btn-lavender px-3 py-1.5 text-xs">
              ${ICONS.back}
              <span>Home</span>
            </button>
            <span class="px-2.5 py-1 rounded-full bg-white/15 text-white text-[11px] font-extrabold border border-white/25">
              PWA: ${escapeHtml(PWA_STATUS.swState)}
            </span>
          </div>

          <h1 class="font-logo text-2xl text-white text-center mb-3 drop-shadow">Settings</h1>

          <!-- Audio Preferences -->
          <div class="lavender-card p-4 mb-3 space-y-2.5">
            <h2 class="font-logo text-base text-[#351a75]">Audio Preferences</h2>
            <div class="flex items-center justify-between bg-white rounded-xl px-3 py-2 border border-[#e5dcff]">
              <span class="text-xs font-extrabold text-[#351a75]">Sound Effects (Minimal UI Mode)</span>
              <button type="button" onclick="toggleSetting('sound')" class="rm-btn ${playerState.settings.sound ? 'btn-green' : 'btn-lavender'} px-3 py-1 text-xs">
                ${playerState.settings.sound ? 'On' : 'Off'}
              </button>
            </div>
            <div class="flex items-center justify-between bg-white rounded-xl px-3 py-2 border border-[#e5dcff]">
              <span class="text-xs font-extrabold text-[#351a75]">Background Music</span>
              <button type="button" onclick="toggleSetting('music')" class="rm-btn ${playerState.settings.music ? 'btn-green' : 'btn-lavender'} px-3 py-1 text-xs">
                ${playerState.settings.music ? 'On' : 'Off'}
              </button>
            </div>
          </div>

          <!-- Account Information & Player Name -->
          <div class="lavender-card p-4 mb-3 space-y-2.5">
            <h2 class="font-logo text-base text-[#351a75]">Account & Profile</h2>
            <div class="text-xs font-bold text-[#5e43a6]">
              Sign-in Mode: <strong class="text-[#351a75]">${escapeHtml(playerState.authProvider)}</strong>
            </div>

            <div class="flex gap-2">
              <input id="settings-name-input" type="text" maxlength="20" value="${escapeHtml(playerState.playerName)}"
                class="flex-1 px-3 py-2 rounded-xl bg-white border-2 border-[#cbbaff] text-xs font-extrabold text-[#2e166b] focus:outline-none focus:border-[#6f3ee0]" />
              <button type="button" onclick="updatePlayerNameFromSettings()" class="rm-btn btn-blue px-3.5 py-2 text-xs">
                Save Name
              </button>
            </div>

            <button type="button" onclick="navigateTo('onboarding')" class="rm-btn btn-lavender w-full py-2 text-xs">
              Switch Onboarding Experience (First Timer / Expert)
            </button>
          </div>

          <!-- Privacy, Terms, Log Out & Account Deletion -->
          <div class="lavender-card p-4 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="openPrivacyModal()" class="rm-btn btn-lavender py-2 text-xs">
                Privacy Info
              </button>
              <button type="button" onclick="openTermsModal()" class="rm-btn btn-lavender py-2 text-xs">
                Terms of Service
              </button>
            </div>

            <button type="button" onclick="handleLogout()" class="rm-btn btn-purple w-full py-2 text-xs">
              Log Out
            </button>

            <button type="button" onclick="confirmDeleteAccount()" class="rm-btn btn-pink w-full py-2 text-xs">
              Delete Account & Reset Data
            </button>
          </div>
        </div>
        ${getCloudsSVG()}
      `;
    }

    function toggleSetting(key) {
      playerState.settings[key] = !playerState.settings[key];
      savePlayerState();
      renderScreen();
    }

    function updatePlayerNameFromSettings() {
      const input = document.getElementById('settings-name-input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      playerState.playerName = val;
      savePlayerState();
      renderScreen();
      showInfoModal('Profile Updated', 'SAVED', `<p>Your player name has been updated to <strong>${escapeHtml(val)}</strong>.</p>`);
    }

    function openPrivacyModal() {
      showInfoModal(
        'Privacy Information',
        'LOCAL STORAGE FIRST',
        `<p><strong>RANDOM MIND</strong> stores your player profile, SYNX balance, XP progression, and settings locally on your device via browser Local Storage.</p><p class="mt-2">No passwords are stored in local storage, and no personal data is transmitted to third-party servers in this prototype build.</p>`
      );
    }

    function openTermsModal() {
      showInfoModal(
        'Terms of Service',
        'EDUCATIONAL QUIZ',
        `<p><strong>RANDOM MIND</strong> is designed for educational entertainment and general knowledge learning across 17 subject categories.</p><p class="mt-2">SYNX is a virtual in-game reward currency with no real-world monetary value.</p>`
      );
    }

    function handleLogout() {
      playerState.onboardingComplete = false;
      savePlayerState();
      navigateTo('onboarding');
    }

    function confirmDeleteAccount() {
      showInfoModal(
        'Delete Local Account Data?',
        'PERMANENT RESET',
        `<p>This will permanently erase your saved progress, player level, and reset your SYNX balance back to <strong>$ 50 SYNX</strong>.</p>`,
        () => {
          localStorage.removeItem(STORAGE_KEY);
          playerState = getDefaultState();
          navigateTo('onboarding');
        },
        'Delete Everything'
      );
    }

    /* ==========================================================================
       10. INITIALIZATION ON WINDOW LOAD
       ========================================================================== */
    window.onload = function () {
      renderStarBackdrop();
      renderScreen();
      runInitialLoadingSequence();
    };
  </script>
</body>
</html>
